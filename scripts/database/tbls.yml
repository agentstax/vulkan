# tbls config: snapshot the live dev database's schema (just schema-diagram).
# Documents the shared control-plane tables plus ONE per-topic family. Every
# family shares the same DDL (topic createTopicTables), so which topic's
# family is shown does not matter; *_1 belongs to the first topic
# RegisterSystem creates (__system.metrics) and always exists.
dsn: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable

docPath: bin/schema

include:
  - system_config
  - topic_config
  - topic_config_log
  - consumer_group_config
  - worker_config
  - worker_config_log
  - worker_instance
  - cron_job
  - migration_log
  - "*_1"

# message_log partitions its rows into child tables (message_log_1_0, ...);
# the parent carries the structure, the children add nothing to the diagram.
exclude:
  - "message_log_1_*"

# The per-topic family declares no foreign keys -- the family is DROPped
# wholesale on topic destroy -- so its relations are declared here instead.
relations:
  - table: binding_config_1
    columns: [consumer_group_id]
    parentTable: consumer_group_config
    parentColumns: [id]
  - table: binding_config_log_1
    columns: [consumer_group_id]
    parentTable: consumer_group_config
    parentColumns: [id]
  - table: consumer_group_cursor_1
    columns: [consumer_group_id]
    parentTable: consumer_group_config
    parentColumns: [id]
  - table: claim_lease_1
    columns: [consumer_group_id]
    parentTable: consumer_group_config
    parentColumns: [id]
  - table: key_lease_1
    columns: [consumer_group_id]
    parentTable: consumer_group_config
    parentColumns: [id]
  - table: exception_queue_1
    columns: [consumer_group_id]
    parentTable: consumer_group_config
    parentColumns: [id]
  - table: exception_queue_1
    columns: [message_id]
    parentTable: message_log_1
    parentColumns: [id]
  - table: delivery_log_1
    columns: [consumer_group_id]
    parentTable: consumer_group_config
    parentColumns: [id]
  - table: delivery_log_1
    columns: [message_id]
    parentTable: message_log_1
    parentColumns: [id]
  - table: compaction_head_1
    columns: [head_id]
    parentTable: message_log_1
    parentColumns: [id]
