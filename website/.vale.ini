StylesPath = .vale/styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt
Packages = Google

[*.{md,mdx}]
BasedOnStyles = Google, Vulkan
# the site's voice sets spaced em-dashes deliberately
Google.EmDash = NO
# durations in this documentation are Go values -- 5s, 100ms, 1s are spelled
# the way a caller types them, and "5 s" would be a value nobody can paste
Google.Units = NO
# every Go identifier the docs name (vulkan.Head(), producer.Tx) reads to this
# rule as a sentence boundary missing its space
Google.Spacing = NO
